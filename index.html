<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi inventario</title>
<style>
:root{color-scheme:light dark;--bg:#f6f5f2;--c:#fff;--t:#1d2329;--m:#66727d;--b:#e0ddd6;--a:#0b7a5a;--w:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#14181c;--c:#1d2329;--t:#e8ecef;--m:#9aa7b2;--b:#2c353d;--a:#4cc79e;--w:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;padding-bottom:80px}
header{position:sticky;top:0;background:var(--bg);padding:12px 14px 8px;z-index:5;max-width:900px;margin:auto}
h1{margin:0 0 8px;font-size:20px}h2{margin:0 0 6px;font-size:18px}h3{margin:0 0 6px;font-size:16px}
input,select,button{font:inherit}button{cursor:pointer}
header input{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t)}
main{padding:4px 14px 14px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;padding:14px 4px;background:none;border:0;color:var(--m);font-size:14px}nav .on{color:var(--a);font-weight:700}
.pri{background:var(--a);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:99px;padding:6px 12px;font-size:14px}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{text-align:left;background:var(--c);border:1px solid var(--b);border-radius:12px;padding:0 0 10px;color:var(--t);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.card>*:not(.ph){padding:0 10px}
.ph{aspect-ratio:1/1;position:relative;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--m);font-size:13px;text-align:center;margin-bottom:6px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.ph.big{aspect-ratio:auto;height:280px;border-radius:10px}
small,.nota{color:var(--m);font-size:13px}.pr{color:var(--a);font-weight:700}.bajo{color:var(--w);font-weight:600}
.vacio{color:var(--m);text-align:center;padding:30px 10px}
.aviso{background:#f0b42922;border:1px solid #f0b429;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#sheet[hidden]{display:none}
.box{background:var(--c);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) 16px}
label{display:block;margin:10px 0;font-size:14px;color:var(--m)}
label input,label select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:16px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.row button,.btn{flex:1;min-width:110px;padding:11px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);text-align:center}
.row .pri{background:var(--a);color:#fff;border:0}
.del{margin-top:14px;width:100%;padding:10px;border:1px solid var(--w);background:none;color:var(--w);border-radius:10px}
.vend,.bloque{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin:10px 0}
.vh{display:flex;justify-content:space-between;margin-bottom:6px}
.fila{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--b)}
.fila button{padding:7px 9px;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font-size:13px}
.fi{flex:1;min-width:0}.fi b{display:block;font-size:14px}
.mini{width:42px;height:42px;border-radius:8px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}.mini img{width:100%;height:100%;object-fit:cover}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px}.kpi b{display:block;font-size:16px}
.lin{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--b);font-size:14px}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:90%}#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>📦 Mi inventario</h1><input id="q" type="search" placeholder="Buscar producto, marca o código..."></header>
<main id="main"></main>
<nav>
  <button data-t="prod">Productos</button><button data-t="vend">Vendedores</button>
  <button data-t="rep">Ventas</button><button data-t="mas">Más</button>
</nav>
<div id="sheet" hidden></div><div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
let S={productos:[],vendedores:[],stockV:{},movs:[],sig:1,resp:null},tab='prod',chip='todos',per='mes';

/* ---- guardado en el navegador (IndexedDB) ---- */
const db=new Promise((ok,no)=>{const q=indexedDB.open('inventario_natura_avon',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const idb=(m,...a)=>db.then(d=>new Promise((ok,no)=>{const q=d.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k')[m](...a);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const guardar=()=>idb('put',S,'estado').catch(()=>alert('No pude guardar los datos en este navegador (¿modo privado?).'));
async function cargar(){try{const s=await idb('get','estado');if(s)S=Object.assign(S,s)}catch(e){}render()}

/* ---- ayudas ---- */
const P=id=>S.productos.find(p=>p.id===id),V=id=>S.vendedores.find(v=>v.id===id);
const conV=pid=>Object.entries(S.stockV).reduce((a,[k,n])=>a+(+k.split(':')[1]===pid?n:0),0);
const tiene=vid=>Object.entries(S.stockV).map(([k,n])=>{const [a,b]=k.split(':');return{a:+a,n,p:P(+b)}}).filter(x=>x.a===vid&&x.n>0&&x.p);
const sv=(vid,pid,d)=>{const k=vid+':'+pid;S.stockV[k]=(S.stockV[k]||0)+d};
const reg=(t,pid,n,pr,vid,cl)=>S.movs.push({f:new Date().toISOString(),pid,t,n,pr:pr||0,co:P(pid).costo,vid:vid||null,cl:cl||''});
const abrir=h=>{$('#sheet').innerHTML=`<div class="box">${h}</div>`;$('#sheet').hidden=false};
const cerrar=()=>{$('#sheet').hidden=true;$('#sheet').innerHTML=''};
const fin=async m=>{await guardar();cerrar();render();if(m)toast(m)};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function bajar(nombre,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=nombre;a.click()}
function reducir(file,max=700){return new Promise(r=>{if(!file||!file.size)return r(null);const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.8))};im.onerror=()=>r(null);im.src=u})}

function form(tit,campos,ok,txt='Guardar'){
  abrir(`<h2>${esc(tit)}</h2><form id="f">${campos.map(c=>`<label>${c.l}${c.t==='select'
    ?`<select name="${c.n}">${c.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(c.v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`
    :`<input name="${c.n}" type="${c.t||'text'}" value="${esc(c.v)}" ${c.r?'required':''} ${c.t==='number'?'step="any" inputmode="decimal"':''} ${c.t==='file'?'accept="image/*"':''}>`}</label>`).join('')}
    <div class="row"><button type="button" onclick="cerrar()">Cancelar</button><button class="pri">${txt}</button></div></form>`);
  $('#f').onsubmit=async e=>{e.preventDefault();await ok(Object.fromEntries(new FormData(e.target)))};
}

/* ---- vistas ---- */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#q').hidden=tab!=='prod';
  $('#main').innerHTML={prod:vProd,vend:vVend,rep:vRep,mas:vMas}[tab]();
}
const tarjeta=p=>{const v=conV(p.id);return `<button class="card" data-a="prod" data-i="${p.id}"><div class="ph">${p.foto?`<img src="${p.foto}" alt="">`:'<span>📷<br>Sin foto</span>'}</div><b>${esc(p.nombre)}</b><small>${esc(p.marca)} · ${esc(p.codigo)}</small><span class="pr">${money(p.precio)}</span><small class="${p.stock<=p.min?'bajo':''}">Yo: ${p.stock}${v?` · Vend: ${v}`:''}</small></button>`};
function vProd(){
  const q=$('#q').value.toLowerCase().trim();
  let l=S.productos.filter(p=>!q||[p.codigo,p.nombre,p.marca,p.categoria].join(' ').toLowerCase().includes(q));
  if(chip==='rep')l=l.filter(p=>p.stock<=p.min);if(chip==='foto')l=l.filter(p=>!p.foto);
  const chips=[['todos','Todos'],['rep','Por reponer'],['foto','Sin foto']].map(([k,t])=>`<button class="chip${chip===k?' on':''}" data-a="chip" data-i="${k}">${t}</button>`).join('');
  const av=S.productos.length&&(!S.resp||Date.now()-new Date(S.resp)>7*864e5)?'<div class="aviso">💾 Hace tiempo que no haces respaldo. Ve a «Más» → Descargar respaldo.</div>':'';
  return `${av}<div class="top"><div class="chips">${chips}</div><button class="pri" data-a="nuevoP">+ Producto</button></div>`+
    (l.length?`<div class="grid">${l.map(tarjeta).join('')}</div>`:`<p class="vacio">${S.productos.length?'Nada coincide.':'Aún no tienes productos.<br>Toca «+ Producto» para agregar el primero.'}</p>`);
}
function vVend(){
  return `<div class="top"><span></span><button class="pri" data-a="nuevoV">+ Vendedor</button></div>`+(S.vendedores.length?S.vendedores.map(v=>{
    const t=tiene(v.id);
    return `<section class="vend"><div class="vh"><b>${esc(v.nombre)}</b><span>${t.reduce((a,x)=>a+x.n,0)} uds · ${money(t.reduce((a,x)=>a+x.n*x.p.precio,0))}</span></div>`+
    (t.map(x=>`<div class="fila"><div class="mini">${x.p.foto?`<img src="${x.p.foto}" alt="">`:'📷'}</div><div class="fi"><b>${esc(x.p.nombre)}</b><small>${x.n} con ${esc(v.nombre)}</small></div><button data-a="vendio" data-i="${v.id}" data-j="${x.p.id}">Vendió</button><button data-a="devolvio" data-i="${v.id}" data-j="${x.p.id}">Devolvió</button></div>`).join('')||'<p class="nota">No tiene mercancía.</p>')+
    `<div class="row"><button data-a="entregar" data-i="${v.id}">Entregarle producto</button>${t.length?'':`<button data-a="quitarV" data-i="${v.id}">Quitar vendedor</button>`}</div></section>`}).join('')
    :'<p class="vacio">Aún no tienes vendedores.<br>Toca «+ Vendedor».</p>');
}
function vRep(){
  const h=new Date(),d0=per==='hoy'?new Date(h.getFullYear(),h.getMonth(),h.getDate()):per==='mes'?new Date(h.getFullYear(),h.getMonth(),1):new Date(0);
  const f=S.movs.filter(m=>m.t==='VENTA'&&new Date(m.f)>=d0);
  const ing=f.reduce((a,m)=>a+m.n*m.pr,0),cos=f.reduce((a,m)=>a+m.n*m.co,0),u=f.reduce((a,m)=>a+m.n,0),q={},t={};
  const nomP=id=>(P(id)||{nombre:'(producto eliminado)'}).nombre,nomV=m=>m.vid?(V(m.vid)||{nombre:'(vendedor quitado)'}).nombre:'Yo';
  f.forEach(m=>{const k=nomV(m);q[k]=q[k]||[0,0,0];q[k][0]+=m.n;q[k][1]+=m.n*m.pr;q[k][2]+=m.n*(m.pr-m.co);t[nomP(m.pid)]=(t[nomP(m.pid)]||0)+m.n});
  const chips=[['hoy','Hoy'],['mes','Este mes'],['todo','Todo']].map(([k,x])=>`<button class="chip${per===k?' on':''}" data-a="per" data-i="${k}">${x}</button>`).join('');
  return `<div class="chips" style="margin:8px 0">${chips}</div><div class="kpis"><div class="kpi"><small>Vendido</small><b>${money(ing)}</b></div><div class="kpi"><small>Ganancia</small><b>${money(ing-cos)}</b></div><div class="kpi"><small>Piezas</small><b>${u}</b></div></div>`+
  (f.length?`<section class="bloque"><h3>Ventas por quién</h3>${Object.entries(q).sort((a,b)=>b[1][1]-a[1][1]).map(([k,x])=>`<div class="lin"><span>${esc(k)} · ${x[0]} pzas</span><span>${money(x[1])} <small>(gan. ${money(x[2])})</small></span></div>`).join('')}</section>
  <section class="bloque"><h3>Más vendidos</h3>${Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,n])=>`<div class="lin"><span>${esc(k)}</span><span>${n} pzas</span></div>`).join('')}</section>
  <section class="bloque"><h3>Últimas ventas</h3>${f.slice(-8).reverse().map(m=>`<div class="lin"><span>${new Date(m.f).toLocaleDateString('es-MX')} · ${esc(nomP(m.pid))} ×${m.n}<br><small>${esc(nomV(m))}${m.cl?' → '+esc(m.cl):''}</small></span><span>${money(m.n*m.pr)}</span></div>`).join('')}</section>`:'<p class="vacio">No hay ventas en este periodo.</p>');
}
const NT={VENTA:'Venta',ENTREGA:'Entrega a vendedor',DEVOLUCION:'Devolución',ENTRADA:'Entrada de mercancía',AJUSTE:'Ajuste de stock'};
function vMas(){
  const m=S.movs[S.movs.length-1];
  return `<section class="bloque"><h3>💾 Respaldo</h3><p>Tus datos viven en este navegador. ${S.resp?'Último respaldo: '+new Date(S.resp).toLocaleDateString('es-MX')+'.':'Aún no haces respaldo.'}</p>
  <div class="row"><button class="pri" data-a="resp">Descargar respaldo</button><label class="btn" style="margin:0">Cargar respaldo<input type="file" accept=".json" hidden id="imp"></label></div>
  <p class="nota">Para pasar tus datos de la computadora al celular (o al revés): descarga el respaldo, envíatelo por WhatsApp y cárgalo en el otro. Cargar un respaldo reemplaza todo lo que haya en ese dispositivo.</p></section>
  <section class="bloque"><h3>🌐 Catálogo para tu página</h3><p class="nota">Descarga un archivo con nombre, foto, precio y disponibilidad de cada producto. No incluye costos ni vendedores.</p><button class="pri" data-a="cat">Descargar productos.json</button></section>
  <section class="bloque"><h3>↩️ Deshacer</h3>${m?`<p class="nota">Último movimiento: ${NT[m.t]} · ${esc((P(m.pid)||{nombre:'(eliminado)'}).nombre)} × ${m.n}</p><button data-a="undo" class="chip">Deshacer ese movimiento</button>`:'<p class="nota">Aún no hay movimientos.</p>'}</section>`;
}

/* ---- acciones ---- */
const A={
  chip:k=>{chip=k;render()},per:k=>{per=k;render()},
  prod:id=>{const p=P(+id),v=conV(p.id);abrir(`<div class="ph big">${p.foto?`<img src="${p.foto}" alt="">`:'<span>📷 Sin foto</span>'}</div><h2>${esc(p.nombre)}</h2><p><b class="pr">${money(p.precio)}</b> · ${esc(p.marca)} · ${esc(p.categoria)} · ${esc(p.codigo)}</p><p>Yo tengo: <b>${p.stock}</b>${v?` · Con vendedores: <b>${v}</b>`:''}<br><small>Costo ${money(p.costo)} · ganancia por pieza ${money(p.precio-p.costo)}</small></p><div class="row"><button class="pri" data-a="vender" data-i="${p.id}">Vender</button><button data-a="entregar" data-j="${p.id}">Entregar a vendedor</button></div><div class="row"><button data-a="recibi" data-i="${p.id}">Recibí pedido</button><button data-a="editarP" data-i="${p.id}">Editar</button><button onclick="cerrar()">Cerrar</button></div>`)},
  nuevoP:()=>formP(0),editarP:id=>formP(+id),
  nuevoV:()=>form('Nuevo vendedor',[{n:'nombre',l:'Nombre',r:1}],d=>{S.vendedores.push({id:S.sig++,nombre:d.nombre.trim()});fin()}),
  quitarV:id=>{if(confirm('¿Quitar este vendedor?')){S.vendedores=S.vendedores.filter(v=>v.id!==+id);fin()}},
  delP:id=>{const p=P(+id);if(conV(p.id))return alert('No se puede: hay piezas con vendedores. Primero registra su venta o devolución.');if(confirm(`¿Eliminar «${p.nombre}»?`)){S.productos=S.productos.filter(x=>x.id!==p.id);fin('Producto eliminado')}},
  vender:id=>{const p=P(+id);form(`Vender · ${p.nombre}`,[{n:'n',l:`Cantidad (tienes ${p.stock})`,t:'number',v:1,r:1},{n:'pr',l:'Precio unitario',t:'number',v:p.precio,r:1},{n:'cl',l:'Cliente (opcional)'}],d=>{const n=parseInt(d.n);if(!(n>=1)||n>p.stock)return alert(`Cantidad no válida. Tienes ${p.stock}.`);p.stock-=n;reg('VENTA',p.id,n,+d.pr,0,d.cl);fin(`Venta registrada: ${money(n*d.pr)}`)},'Registrar venta')},
  recibi:id=>{const p=P(+id);form(`Recibí pedido · ${p.nombre}`,[{n:'n',l:'Cantidad recibida',t:'number',v:1,r:1},{n:'co',l:'Costo unitario de este pedido',t:'number',v:p.costo,r:1}],d=>{const n=parseInt(d.n);if(!(n>=1))return alert('Cantidad no válida.');p.costo=+d.co;p.stock+=n;reg('ENTRADA',p.id,n,0);fin(`Ahora tienes ${p.stock}`)})},
  entregar:(vid,pid)=>{
    vid=+vid||0;pid=+pid||0;const disp=S.productos.filter(p=>p.stock>0);
    if(!S.vendedores.length){tab='vend';render();cerrar();return alert('Primero agrega un vendedor.')}
    if(!disp.length)return alert('No tienes productos con stock para entregar.');
    const c=[];if(!vid)c.push({n:'v',l:'Vendedor',t:'select',o:S.vendedores.map(v=>[v.id,v.nombre])});
    if(!pid)c.push({n:'p',l:'Producto',t:'select',o:disp.map(p=>[p.id,`${p.nombre} (tienes ${p.stock})`])});
    c.push({n:'n',l:'Cantidad',t:'number',v:1,r:1});
    form('Entregar mercancía',c,d=>{const p=P(+(pid||d.p)),v=V(+(vid||d.v)),n=parseInt(d.n);if(!(n>=1)||n>p.stock)return alert(`Solo tienes ${p.stock} de «${p.nombre}».`);p.stock-=n;sv(v.id,p.id,n);reg('ENTREGA',p.id,n,p.precio,v.id);fin(`${n} × ${p.nombre} → ${v.nombre}`)},'Entregar');
  },
  vendio:(vid,pid)=>{const p=P(+pid),v=V(+vid),h=S.stockV[vid+':'+pid];form(`${v.nombre} vendió · ${p.nombre}`,[{n:'n',l:`Cantidad (tiene ${h})`,t:'number',v:1,r:1},{n:'pr',l:'Precio unitario',t:'number',v:p.precio,r:1},{n:'cl',l:'Cliente (opcional)'}],d=>{const n=parseInt(d.n);if(!(n>=1)||n>h)return alert(`Cantidad no válida. Tiene ${h}.`);sv(v.id,p.id,-n);reg('VENTA',p.id,n,+d.pr,v.id,d.cl);fin(`${v.nombre} vendió ${money(n*d.pr)}`)},'Registrar venta')},
  devolvio:(vid,pid)=>{const p=P(+pid),v=V(+vid),h=S.stockV[vid+':'+pid];form(`Devolución · ${p.nombre}`,[{n:'n',l:`Cantidad devuelta (tiene ${h})`,t:'number',v:h,r:1}],d=>{const n=parseInt(d.n);if(!(n>=1)||n>h)return alert(`Cantidad no válida. Tiene ${h}.`);sv(v.id,p.id,-n);p.stock+=n;reg('DEVOLUCION',p.id,n,p.precio,v.id);fin('Devolución registrada')},'Registrar')},
  resp:()=>{S.resp=new Date().toISOString();guardar();bajar(`respaldo_inventario_${S.resp.slice(0,10)}.json`,JSON.stringify(S));render();toast('Respaldo descargado')},
  cat:()=>{bajar('productos.json',JSON.stringify(S.productos.map(p=>({codigo:p.codigo,nombre:p.nombre,marca:p.marca,categoria:p.categoria,precio:p.precio,disponible:p.stock+conV(p.id)>0,foto:p.foto}))));toast('Catálogo descargado')},
  undo:()=>{
    const m=S.movs[S.movs.length-1];if(!m)return;const p=P(m.pid);if(!p)return alert('Ese producto ya no existe.');
    if(m.t==='VENTA'){m.vid?sv(m.vid,m.pid,m.n):p.stock+=m.n}
    else if(m.t==='ENTREGA'){if((S.stockV[m.vid+':'+m.pid]||0)<m.n)return alert('El vendedor ya no tiene esa mercancía.');sv(m.vid,m.pid,-m.n);p.stock+=m.n}
    else if(m.t==='DEVOLUCION'){if(p.stock<m.n)return alert('No se puede deshacer: el stock quedaría negativo.');p.stock-=m.n;sv(m.vid,m.pid,m.n)}
    else{if(p.stock-m.n<0)return alert('No se puede deshacer: el stock quedaría negativo.');p.stock-=m.n}
    S.movs.pop();guardar();render();toast('Movimiento deshecho');
  }
};
function formP(id){
  const p=id?P(id):null;
  form(p?'Editar producto':'Nuevo producto',[
    {n:'nombre',l:'Nombre',v:p?.nombre,r:1},{n:'codigo',l:'Código (opcional)',v:p?.codigo},
    {n:'marca',l:'Marca',t:'select',o:[['Natura','Natura'],['Avon','Avon']],v:p?.marca},
    {n:'categoria',l:'Categoría (perfume, crema, shampoo...)',v:p?.categoria},
    {n:'costo',l:'Costo (lo que te cuesta)',t:'number',v:p?.costo,r:1},{n:'precio',l:'Precio de venta',t:'number',v:p?.precio,r:1},
    {n:'stock',l:'Cantidad que tengo yo',t:'number',v:p?p.stock:0,r:1},{n:'min',l:'Avisarme cuando me queden',t:'number',v:p?p.min:2,r:1},
    {n:'foto',l:p?.foto?'Cambiar foto':'Foto (cámara o galería)',t:'file'}
  ],async d=>{
    const foto=await reducir(d.foto),cod=(d.codigo||'').trim()||('P'+(p?p.id:S.sig)),stock=Math.max(0,parseInt(d.stock)||0);
    if(S.productos.some(x=>x.codigo.toLowerCase()===cod.toLowerCase()&&x.id!==p?.id))return alert('Ya existe un producto con ese código.');
    const datos={nombre:d.nombre.trim(),codigo:cod,marca:d.marca,categoria:(d.categoria||'').trim(),costo:+d.costo,precio:+d.precio,min:parseInt(d.min)||0};
    if(p){if(stock!==p.stock)S.movs.push({f:new Date().toISOString(),pid:p.id,t:'AJUSTE',n:stock-p.stock,pr:0,co:p.costo,vid:null,cl:''});Object.assign(p,datos,{stock});if(foto)p.foto=foto}
    else{const n=Object.assign({id:S.sig++,stock,foto:foto||''},datos);S.productos.push(n);if(stock)reg('ENTRADA',n.id,stock,0)}
    fin('Producto guardado');
  });
  if(p)$('#f').insertAdjacentHTML('beforeend',`<button type="button" class="del" data-a="delP" data-i="${p.id}">Eliminar producto</button>`);
}
async function importar(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());if(!Array.isArray(d.productos))throw 0;
    if(!confirm('Esto reemplaza TODOS los datos de este dispositivo con los del respaldo. ¿Continuar?'))return;
    S=Object.assign({productos:[],vendedores:[],stockV:{},movs:[],sig:1,resp:null},d);await guardar();render();toast('Respaldo cargado')}
  catch(e){alert('Ese archivo no parece un respaldo válido.')}
}

/* ---- eventos ---- */
document.addEventListener('click',e=>{
  if(e.target.id==='sheet')return cerrar();
  const t=e.target.closest('nav button');if(t){tab=t.dataset.t;return render()}
  const b=e.target.closest('[data-a]');if(b)A[b.dataset.a]?.(b.dataset.i,b.dataset.j);
});
document.addEventListener('change',e=>{if(e.target.id==='imp')importar(e.target.files[0])});
$('#q').addEventListener('input',render);
cargar();
</script>
